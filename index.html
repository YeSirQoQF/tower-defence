<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>3D塔防游戏</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>

  <div id="file-warning">
    <div class="warning-card">
      <p class="eyebrow">FILE PROTOCOL</p>
      <h1>请用本地服务器打开</h1>
      <p>three.js 的 ES Module 无法通过 <code>file://</code> 协议直接加载，所以直接双击 index.html 是玩不了的。</p>
      <ol>
        <li>双击项目目录里的 <b>start.bat</b></li>
        <li>或在项目目录执行 <code>npm start</code></li>
        <li>浏览器打开 <code>http://127.0.0.1:8080</code></li>
      </ol>
    </div>
  </div>

  <div id="hud">
    <header class="hud-top">
      <div class="stats">
        <div class="stat">
          <span class="dot gold"></span>
          <span class="label">金币</span>
          <strong id="stat-gold">0</strong>
        </div>
        <div class="stat">
          <span class="dot life"></span>
          <span class="label">生命</span>
          <strong id="stat-lives">0</strong>
        </div>
        <div class="stat">
          <span class="dot wave"></span>
          <span class="label">波次</span>
          <strong id="stat-wave">0 / 12</strong>
        </div>
        <div class="stat">
          <span class="dot enemy"></span>
          <span class="label">场上</span>
          <strong id="stat-enemies">0</strong>
        </div>
        <div class="stat">
          <span class="dot score"></span>
          <span class="label">分数</span>
          <strong id="stat-score">0</strong>
        </div>
      </div>

      <div class="seed-area">
        <button id="btn-copy" class="ghost" title="复制当前种子链接">
          种子 <b id="seed-label">----</b>
        </button>
        <select id="mode" title="模式"></select>
        <select id="difficulty" title="难度"></select>
        <button id="btn-new" class="ghost">新地图</button>
      </div>
    </header>

    <aside id="wave-panel">
      <div class="panel-head">
        <span id="wave-title">准备阶段</span>
        <div class="speed">
          <button id="btn-pause" class="pause-toggle" aria-pressed="false" title="暂停 / 播放">暂停</button>
          <button data-speed="1" class="active">1x</button>
          <button data-speed="2">2x</button>
          <button data-speed="3">3x</button>
          <button data-speed="4">4x</button>
        </div>
      </div>
      <div id="wave-preview" class="preview"></div>
      <button id="btn-wave" class="primary">开始第 1 波</button>
      <div id="wave-tip" class="tip"></div>
    </aside>

    <div id="tower-bar"></div>

    <div id="tower-panel" class="hidden"></div>

    <canvas id="minimap" class="hidden" width="200" height="200"></canvas>

    <div id="help-wrap">
      <button id="help-button" aria-label="游戏说明">?</button>
      <span class="help-tooltip">游戏说明</span>
    </div>
  </div>

  <div id="toast"></div>

  <footer id="site-footer">
    <span>© 葉sir</span>
    <span class="footer-sep">|</span>
    <a href="https://github.com/YeSirQoQF" target="_blank" rel="noopener noreferrer">作者 GitHub</a>
    <span class="footer-sep">|</span>
    <a href="https://github.com/YeSirQoQF/tower-defence" target="_blank" rel="noopener noreferrer">仓库页面</a>
    <span class="footer-sep">|</span>
    <span>All right reserved.</span>
  </footer>

  <div id="overlay" class="hidden">
    <div class="overlay-card">
      <p class="eyebrow" id="overlay-eyebrow">RESULT</p>
      <h1 id="overlay-title"></h1>
      <p class="overlay-desc" id="overlay-desc"></p>
      <div class="overlay-stats" id="overlay-stats"></div>
      <div class="overlay-actions">
        <button id="btn-retry" class="primary">同种子重试</button>
        <button id="btn-again" class="ghost">换一张地图</button>
      </div>
      <p class="seed-line">种子 <b id="overlay-seed"></b></p>
    </div>
  </div>

  <div id="help-modal" class="hidden">
    <div class="help-card">
      <p class="eyebrow">GUIDE</p>
      <div id="help-readme" class="help-markdown" hidden></div>
      <button id="help-close" class="primary">关闭</button>
    </div>
  </div>

  <script>
    (function () {
      if (location.protocol === 'file:') {
        document.documentElement.classList.add('file-protocol');
        return;
      }
      var script = document.createElement('script');
      script.type = 'module';
      script.src = './js/main.js';
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
